name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

env:
  DOTNET_VERSION: '8.0.x'
  AWS_REGION: us-east-1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  terraform-plan:
    name: Terraform Format Check & Plan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Format Check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Build placeholder Lambda package for plan
        run: |
          mkdir -p artifacts
          echo "placeholder" > artifacts/placeholder.txt
          zip -j artifacts/lambda.zip artifacts/placeholder.txt

      - name: Terraform Init
        working-directory: infra
        env:
          TF_VAR_db_connection_string: ${{ secrets.DB_CONNECTION_STRING }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_db_connection_string: ${{ secrets.DB_CONNECTION_STRING }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
        run: terraform plan -input=false

  deploy:
    name: Publish & Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Lambda package
        run: |
          dotnet publish src/OficinaMecanica.Auth.Lambda -c Release -r linux-x64 --self-contained false -o publish
          mkdir -p artifacts
          cd publish
          zip -r ../artifacts/lambda.zip .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_db_connection_string: ${{ secrets.DB_CONNECTION_STRING }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
        run: terraform apply -auto-approve -input=false
